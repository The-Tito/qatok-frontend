<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Antes de jugar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Chakra+Petch:wght@600;700&amp;family=Silkscreen:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#2A2238}a:hover{color:#5E5470}
.pf{font-family:'Chakra Petch',sans-serif}
.sk{font-family:'Silkscreen',monospace;text-transform:uppercase;letter-spacing:.04em}
.px{border:3px solid #2A2238;box-shadow:4px 4px 0 #2A2238}
.seg{background-image:repeating-linear-gradient(90deg,transparent 0 14px,#2A2238 14px 16px)}
svg.sp{shape-rendering:crispEdges;display:block}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;color:#2A2238;font-family:'IBM Plex Mono',monospace;display:flex;flex-direction:column;overflow:hidden">

  <div style="height:250px;flex-shrink:0;background:{{c.tint}};border-bottom:3px solid #2A2238;position:relative;overflow:hidden">
    <a href="CatalogoV2.dc.html" aria-label="Volver al catálogo" class="sk" style="position:absolute;left:16px;top:16px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:3px solid #2A2238;background:#FFFFFF;text-decoration:none;font-size:16px;font-weight:700">◀</a>
    <span class="sk" style="position:absolute;right:16px;top:24px;font-size:11px;font-weight:700;padding:6px 8px;border:2px solid #2A2238;background:#FFFFFF;color:{{c.dark}}">Tipo {{c.name}}</span>
    <svg class="sp" style="position:absolute;left:70px;top:90px" width="21" height="21" viewBox="0 0 11 11" aria-hidden="true"><path fill="{{c.base}}" d="M5 0h1v3h-1z M4 3h3v1h-3z M3 4h5v1h-5z M0 5h11v1h-11z M3 6h5v1h-5z M4 7h3v1h-3z M5 8h1v3h-1z"/></svg>
    <svg class="sp" style="position:absolute;right:60px;top:80px" width="28" height="28" viewBox="0 0 11 11" aria-hidden="true"><path fill="{{c.base}}" d="M5 0h1v3h-1z M4 3h3v1h-3z M3 4h5v1h-5z M0 5h11v1h-11z M3 6h5v1h-5z M4 7h3v1h-3z M5 8h1v3h-1z"/></svg>
    <svg class="sp" style="position:absolute;left:135px;top:72px" width="120" height="120" viewBox="0 0 16 16" aria-hidden="true"><path fill="#2A2238" d="M5 0h6v1h-6z M3 1h10v1h-10z M2 2h12v8h-12z M4 10h8v1h-8z M2 11h12v1h-12z M1 12h14v4h-14z"/><path fill="#6B3E2E" d="M5 1h6v1h-6z M3 2h10v3h-10z M3 5h1v4h-1z M12 5h1v4h-1z"/><path fill="#9A5E44" d="M6 2h3v1h-3z M4 3h2v1h-2z"/><path fill="#E8B48A" d="M5 4h6v1h-6z M4 5h8v4h-8z M5 9h6v1h-6z M6 10h4v1h-4z"/><path fill="#C98E64" d="M6 10h4v1h-4z"/><path fill="#2A2238" d="M5 5h1v1h-1z M6 6h1v1h-1z M10 5h1v1h-1z M9 6h1v1h-1z M5 7h2v1h-2z M9 7h2v1h-2z M7 8h2v1h-2z M6 9h1v1h-1z M9 9h1v1h-1z"/><path fill="#D9483B" d="M3 11h10v1h-10z M2 12h12v3h-12z M13 0h1v1h-1z M15 0h1v1h-1z M14 1h1v1h-1z M15 2h1v1h-1z"/><path fill="#2A2238" fill-opacity=".28" d="M2 12h2v3h-2z M12 12h2v3h-2z"/><path fill="#FFFFFF" d="M6 11h4v1h-4z M7 12h2v1h-2z"/></svg>
    <div style="position:absolute;left:0;right:0;bottom:0;height:36px;background:{{c.base}};border-top:3px solid #2A2238"></div>
  </div>

  <div style="padding:22px 20px 0;display:flex;flex-direction:column;gap:14px;flex-grow:1">
    <div style="display:flex;gap:12px;align-items:center">
      <span class="sk" style="font-size:11px">★★ Intermedia</span>
      <span class="sk" style="font-size:11px;color:#5E5470">· 15 min ·</span>
      <span class="sk" style="font-size:11px;color:#5E5470">Puedes pausar</span>
    </div>
    <h1 class="pf" style="margin:0;font-size:30px;font-weight:700;line-height:1.05">Cliente molesto por un retraso</h1>
    <p style="margin:0;font-size:14px;line-height:1.6;color:#5E5470">Un cliente reclama por un pedido que lleva una semana de retraso.</p>

    <section class="px" style="background:#FFFFFF;padding:14px 16px;display:flex;flex-direction:column;gap:14px">
      <h2 class="sk" style="margin:0;font-size:13px">Entrena</h2>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;justify-content:space-between;gap:8px"><span style="font-size:13px;font-weight:600">Comunicación efectiva</span><span class="sk" style="font-size:11px;color:#7A4A0B">Voz · 60%</span></div>
        <div style="height:18px;border:3px solid #2A2238;background:#F5F3EF;position:relative"><div class="seg" style="position:absolute;inset:0;width:75%;background-color:#E8A33D"></div><div style="position:absolute;left:70%;top:-7px;bottom:-7px;width:3px;background:#2A2238"></div></div>
        <span style="font-size:11px;color:#5E5470">Tu nivel 75 · esperado 70</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;justify-content:space-between;gap:8px"><span style="font-size:13px;font-weight:600">Resolución de conflictos</span><span class="sk" style="font-size:11px;color:#8A1F16">Fuego · 40%</span></div>
        <div style="height:18px;border:3px solid #2A2238;background:#F5F3EF;position:relative"><div class="seg" style="position:absolute;inset:0;width:92.5%;background-color:#D9483B"></div><div style="position:absolute;left:60%;top:-7px;bottom:-7px;width:3px;background:#2A2238"></div></div>
        <span style="font-size:11px;color:#5E5470">Tu nivel 92.5 · esperado 60</span>
      </div>
    </section>
  </div>

  <div style="padding:16px 20px 24px;display:flex;flex-direction:column;gap:10px">
    <a href="JugarCorreoV2.dc.html" class="sk px" style="display:flex;justify-content:center;align-items:center;gap:10px;height:56px;background:{{c.dark}};color:#FFFFFF;text-decoration:none;font-size:16px;font-weight:700">Comenzar ▶</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tipo":{"editor":"enum","options":["Voz","Fuego","Reloj","Hoja","Chispa","Corazón","Mente","Piedra"],"default":"Voz"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const types = {
      'Voz': ['#E8A33D', '#7A4A0B', '#FCEBC8'], 'Fuego': ['#D9483B', '#8A1F16', '#F9D7D2'],
      'Reloj': ['#8A5CC7', '#4B2A7A', '#E9DDF7'], 'Hoja': ['#4FA35A', '#1F5A28', '#D6EFD5'],
      'Chispa': ['#E2703A', '#7E3410', '#FBDCC9'], 'Corazón': ['#D66BA0', '#7D2453', '#F8D9E8'],
      'Mente': ['#9AA33A', '#4E5414', '#EEF0CF'], 'Piedra': ['#8C8577', '#45403A', '#E8E4DC'],
    };
    const name = this.props.tipo ?? 'Voz';
    const [base, dark, tint] = types[name] ?? types['Voz'];
    return { c: { name, base, dark, tint } };
  }
}
</script>
</body>
</html>
