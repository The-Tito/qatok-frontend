      <input type="text" value="Bruno Díaz" autocomplete="name" style="height:46px;box-sizing:border-box;border:3px solid #2A2238;background:#F5F3EF;padding:0 12px;font:inherit;font-weight:400;font-size:15px;color:#2A2238">

    <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Contraseña
      <input type="password" value="contrasena" autocomplete="new-password" aria-describedby="ayuda-pass" style="height:46px;box-sizing:border-box;border:3px solid #2A2238;background:#F5F3EF;padding:0 12px;font:inherit;font-weight:400;font-size:15px;color:#2A2238">

    </label>

  </form>

  <p style="margin:18px 20px 0;font-size:13px;text-align:center">¿Ya tienes cuenta? <a href="LoginV2.dc.html" style="font-weight:600">Entrar</a></p>

    <div style="position:absolute;left:0;right:0;bottom:30px;height:6px;background:#4FA35A"></div>
  </div>
