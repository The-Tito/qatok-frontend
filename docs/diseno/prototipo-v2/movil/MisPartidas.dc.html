<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mis partidas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Chakra+Petch:wght@600;700&amp;family=Silkscreen:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#2A2238}a:hover{color:#5E5470}
.pf{font-family:'Chakra Petch',sans-serif}
.sk{font-family:'Silkscreen',monospace;text-transform:uppercase;letter-spacing:.04em}
.px{border:3px solid #2A2238;box-shadow:4px 4px 0 #2A2238}
.seg{background-image:repeating-linear-gradient(90deg,transparent 0 14px,#2A2238 14px 16px)}
svg.sp{shape-rendering:crispEdges;display:block}
button{font:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
input,select,textarea{font:inherit;color:#2A2238}
input:focus,select:focus,textarea:focus{outline:3px solid #E8A33D;outline-offset:2px}
::placeholder{color:#8C8577}
</style>
</helmet>
<div style="width:390px;height:980px;box-sizing:border-box;background:#FFFFFF;color:#2A2238;font-family:'IBM Plex Mono',monospace;display:flex;flex-direction:column;overflow:hidden;position:relative">
  <header style="height:64px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 16px;background:#FFFFFF;border-bottom:3px solid #2A2238">
    <a href="PerfilV2.dc.html" aria-label="Volver al perfil" class="sk" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:3px solid #2A2238;background:#FFFFFF;text-decoration:none;font-size:16px;font-weight:700;flex-shrink:0">◀</a>
    <div style="display:flex;flex-direction:column;gap:2px;flex-grow:1;min-width:0">
      <span class="sk" style="font-size:10px;color:#5E5470">Historial</span>
      <span style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Mis partidas</span>
    </div>
  </header>

  <div style="padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px;flex-grow:1">
    <div role="group" aria-label="Estado" style="display:flex;gap:8px;flex-wrap:wrap">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
        <sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}">
          <button type="button" aria-pressed="true" onClick="{{t.pick}}" class="sk" style="min-height:44px;font-size:11px;padding:0 10px;border:3px solid #2A2238;background:#2A2238;color:#FFFFFF;font-weight:700">{{t.label}}</button>
        </sc-if>
        <sc-if value="{{t.off}}" hint-placeholder-val="{{ true }}">
          <button type="button" aria-pressed="false" onClick="{{t.pick}}" class="sk" style="min-height:44px;font-size:11px;padding:0 10px;border:3px solid #2A2238;background:#FFFFFF;color:#2A2238">{{t.label}}</button>
        </sc-if>
      </sc-for>
    </div>

    <span class="sk" style="font-size:11px;color:#5E5470">{{countLabel}}</span>

    <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px">
      <sc-for list="{{items}}" as="a" hint-placeholder-count="4">
        <li class="px" style="background:#FFFFFF;display:flex;flex-direction:column">
          <div style="height:10px;display:flex;border-bottom:3px solid #2A2238"><span style="flex:{{a.f1}};background:{{a.c1}}"></span><span style="flex:{{a.f2}};background:{{a.c2}}"></span></div>
          <div style="padding:12px;display:flex;gap:12px;align-items:center">
            <span style="display:flex;flex-direction:column;gap:6px;flex-grow:1;min-width:0">
              <span style="font-size:14px;font-weight:600">{{a.title}}</span>
              <span class="sk" style="font-size:9px;color:#5E5470">{{a.dates}}</span>
              <span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                <span class="sk" style="font-size:9px;padding:3px 6px;border:2px {{a.border}} #2A2238;background:{{a.sbg}};color:{{a.sfg}}">{{a.status}}</span>
                <span class="sk" style="font-size:10px">{{a.score}}</span>
              </span>
            </span>
            <a href="{{a.href}}" class="sk" style="min-height:44px;display:flex;align-items:center;padding:0 10px;border:3px solid #2A2238;background:{{a.btnBg}};color:{{a.btnFg}};text-decoration:none;font-size:10px;font-weight:700;flex-shrink:0">{{a.action}}</a>
          </div>
        </li>
      </sc-for>
    </ul>

    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <div style="border:3px dashed #8C8577;padding:16px;display:flex;gap:12px;align-items:center">
        <svg class="sp" width="28" height="28" viewBox="0 0 11 11" aria-hidden="true"><path fill="#8C8577" d="M5 0h1v3h-1z M4 3h3v1h-3z M3 4h5v1h-5z M0 5h11v1h-11z M3 6h5v1h-5z M4 7h3v1h-3z M5 8h1v3h-1z"/></svg>
        <p style="margin:0;font-size:13px;line-height:1.5;color:#5E5470">{{emptyText}}</p>
      </div>
    </sc-if>
  </div>

  <nav aria-label="Principal" style="height:72px;flex-shrink:0;border-top:3px solid #2A2238;background:#FFFFFF;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))">
    <a href="CatalogoV2.dc.html" class="sk" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;text-decoration:none;color:#2A2238">
      <svg class="sp" width="20" height="20" viewBox="0 0 11 11" aria-hidden="true"><path fill="#2A2238" d="M5 0h1v3h-1z M4 3h3v1h-3z M3 4h5v1h-5z M0 5h11v1h-11z M3 6h5v1h-5z M4 7h3v1h-3z M5 8h1v3h-1z"/></svg>Jugar</a>
    <a href="PerfilV2.dc.html" aria-current="page" class="sk" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:700;text-decoration:none;background:#2A2238;color:#FFFFFF">
      <svg class="sp" width="20" height="20" viewBox="0 0 12 12" aria-hidden="true"><path fill="#FFFFFF" d="M3 0h6v6h-6z M1 7h10v5h-10z"/></svg>Perfil</a>
    <a href="EvidenciasV2.dc.html" class="sk" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;text-decoration:none;color:#2A2238">
      <svg class="sp" width="20" height="20" viewBox="0 0 12 12" aria-hidden="true"><path fill="#2A2238" d="M1 0h10v1h-10z M2 1h8v4h-8z M3 5h6v1h-6z M4 6h4v1h-4z M5 7h2v2h-2z M3 9h6v1h-6z M2 10h8v2h-8z"/></svg>Evidencias</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 980}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 0 }; }
  renderVals() {
    const sims = {
      cli: { title: 'Cliente molesto por un retraso', f1: 6, c1: '#E8A33D', f2: 4, c2: '#D9483B' },
      ent: { title: 'Tres entregas para mañana', f1: 7, c1: '#8A5CC7', f2: 3, c2: '#E8A33D' },
    };
    const st = {
      IN_PROGRESS: { status: '▶ En curso', sbg: '#2A2238', sfg: '#FFFFFF', border: 'solid', action: 'Seguir ▶', href: 'JugarTarea.dc.html', btnBg: '#2A2238', btnFg: '#FFFFFF' },
      COMPLETED: { status: '★ Completada', sbg: '#F5F3EF', sfg: '#2A2238', border: 'solid', action: 'Ver recorrido', href: 'Recorrido.dc.html', btnBg: '#FFFFFF', btnFg: '#2A2238' },
      ABANDONED: { status: '✕ Abandonada', sbg: '#FFFFFF', sfg: '#2A2238', border: 'dashed', action: 'Ver recorrido', href: 'Recorrido.dc.html', btnBg: '#FFFFFF', btnFg: '#2A2238' },
    };
    const all = [
      ['ent', 'IN_PROGRESS', 'Iniciada el 11 nov 2026', 'Sin puntuación aún'],
      ['ent', 'COMPLETED', '10 oct 2026 · 8 min', '40 / 100'],
      ['cli', 'COMPLETED', '1 oct 2026 · 14 min', '92.5 / 100'],
      ['cli', 'COMPLETED', '20 sep 2026 · 12 min', '37.5 / 100'],
    ].map(([s, status, dates, score]) => ({ ...sims[s], ...st[status], key: status, dates, score }));
    const filters = [['Todas', null], ['En curso', 'IN_PROGRESS'], ['Completadas', 'COMPLETED'], ['Abandonadas', 'ABANDONED']];
    const picked = this.state.tab ?? 0;
    const tabs = filters.map(([label, key], i) => {
      const n = all.filter((a) => key === null || a.key === key).length;
      return { label: label + ' · ' + n, on: i === picked, off: i !== picked, pick: () => this.setState({ tab: i }) };
    });
    const key = filters[picked][1];
    const items = all.filter((a) => key === null || a.key === key);
    const empties = { IN_PROGRESS: 'No tienes partidas en curso.', COMPLETED: 'Aún no completas ninguna partida.', ABANDONED: 'No has abandonado ninguna partida.' };
    return {
      tabs, items, empty: items.length === 0, emptyText: empties[key] ?? '',
      countLabel: items.length === 1 ? '1 partida' : items.length + ' partidas',
    };
  }
}
</script>
</body>
</html>
