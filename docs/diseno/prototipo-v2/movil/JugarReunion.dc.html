<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Paso de reunión</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Chakra+Petch:wght@600;700&amp;family=Silkscreen:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#2A2238}a:hover{color:#5E5470}
.pf{font-family:'Chakra Petch',sans-serif}
.sk{font-family:'Silkscreen',monospace;text-transform:uppercase;letter-spacing:.04em}
.px{border:3px solid #2A2238;box-shadow:4px 4px 0 #2A2238}
.seg{background-image:repeating-linear-gradient(90deg,transparent 0 14px,#2A2238 14px 16px)}
svg.sp{shape-rendering:crispEdges;display:block}
button{font:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
input,select,textarea{font:inherit;color:#2A2238}
input:focus,select:focus,textarea:focus{outline:3px solid #E8A33D;outline-offset:2px}
::placeholder{color:#8C8577}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;color:#2A2238;font-family:'IBM Plex Mono',monospace;display:flex;flex-direction:column;overflow:hidden;position:relative">
  <header style="height:64px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 16px;background:{{c.tint}};border-bottom:3px solid #2A2238">
    <a href="JugarPausa.dc.html" aria-label="Pausar" class="sk" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:3px solid #2A2238;background:#FFFFFF;text-decoration:none;font-size:14px;font-weight:700;flex-shrink:0">II</a>
    <div style="display:flex;flex-direction:column;gap:2px;flex-grow:1;min-width:0">
      <span class="sk" style="font-size:10px;color:{{c.dark}}">Paso 3 · Reunión</span>
      <span style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Cliente molesto por un retraso</span>
    </div>
    <svg class="sp" width="36" height="30" viewBox="0 0 12 10" aria-hidden="true"><path fill="#2A2238" d="M1 0h3v3h-3z M8 0h3v3h-3z M0 9h12v1h-12z"/><path fill="#8C8577" d="M0 4h5v4h-5z M7 4h5v4h-5z"/></svg>
  </header>

  <div style="padding:16px 16px 0;display:flex;flex-direction:column;gap:14px;flex-grow:1;overflow:hidden">
    <div style="display:flex;flex-direction:column;gap:6px">
      <h1 class="pf" style="margin:0;font-size:24px;font-weight:700">Reunión con tu jefa</h1>
      <p style="margin:0;font-size:13px;line-height:1.5;color:#5E5470">Tu jefa quiere saber qué pasó y qué propones.</p>
    </div>

    <article class="px" style="background:#FFFFFF;display:flex;flex-direction:column">
      <div style="padding:10px 12px;border-bottom:3px solid #2A2238;display:flex;flex-direction:column;gap:8px;background:#F5F3EF">
        <span class="sk" style="font-size:10px">Participantes</span>
        <ul aria-label="Participantes" style="list-style:none;margin:0;padding:0;display:flex;gap:8px;flex-wrap:wrap">
          <li style="font-size:12px;font-weight:600;padding:5px 8px;border:2px solid #2A2238;background:#FFFFFF">Tú</li>
          <li style="font-size:12px;font-weight:600;padding:5px 8px;border:2px solid #2A2238;background:#FFFFFF">Laura Méndez (jefa de área)</li>
        </ul>
      </div>
      <div style="padding:12px;display:flex;flex-direction:column;gap:8px">
        <span class="sk" style="font-size:10px">Agenda</span>
        <ol style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px">
          <li style="display:flex;gap:10px;font-size:14px;line-height:1.45"><span class="sk" style="font-size:11px;width:22px;flex-shrink:0;padding-top:2px">01</span>Qué pasó con el pedido 4581</li>
          <li style="display:flex;gap:10px;font-size:14px;line-height:1.45"><span class="sk" style="font-size:11px;width:22px;flex-shrink:0;padding-top:2px">02</span>Qué propones para resolverlo</li>
        </ol>
      </div>
    </article>

    <div style="display:flex;align-items:center;gap:8px">
      <span class="sk" style="font-size:13px;font-weight:700">¿Qué haces?</span>
      <span style="flex-grow:1;height:3px;background:#2A2238"></span>
    </div>

    <div role="radiogroup" aria-label="Opciones" style="display:flex;flex-direction:column;gap:10px">
      <sc-for list="{{options}}" as="o" hint-placeholder-count="2">
        <sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}">
          <button type="button" role="radio" aria-checked="true" onClick="{{o.pick}}" style="display:flex;gap:12px;align-items:flex-start;min-height:48px;padding:12px 14px;border:3px solid #2A2238;color:#2A2238;background:{{c.tint}};box-shadow:4px 4px 0 #2A2238">
            <span class="sk" style="font-size:14px;width:14px;flex-shrink:0">▶</span>
            <span style="font-size:14px;line-height:1.45;text-align:left;font-weight:600">{{o.text}}</span>
          </button>
        </sc-if>
        <sc-if value="{{o.off}}" hint-placeholder-val="{{ true }}">
          <button type="button" role="radio" aria-checked="false" onClick="{{o.pick}}" style="display:flex;gap:12px;align-items:flex-start;min-height:48px;padding:12px 14px;border:3px solid #2A2238;color:#2A2238;background:#FFFFFF">
            <span class="sk" style="font-size:14px;width:14px;flex-shrink:0;color:#E4DCCB">▶</span>
            <span style="font-size:14px;line-height:1.45;text-align:left">{{o.text}}</span>
          </button>
        </sc-if>
      </sc-for>
    </div>
  </div>

  <div style="padding:14px 16px 24px">
    <a href="DecisionV2.dc.html" class="sk px" style="display:flex;justify-content:center;align-items:center;gap:10px;height:56px;background:{{c.dark}};color:#FFFFFF;text-decoration:none;font-size:16px;font-weight:700">Decidir ▶</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tipo": {"editor": "enum", "options": ["Voz", "Fuego", "Reloj", "Hoja", "Chispa", "Corazón", "Mente", "Piedra"], "default": "Voz"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 0 }; }
  renderVals() {
    const types = {
      'Voz': ['#E8A33D', '#7A4A0B', '#FCEBC8'], 'Fuego': ['#D9483B', '#8A1F16', '#F9D7D2'],
      'Reloj': ['#8A5CC7', '#4B2A7A', '#E9DDF7'], 'Hoja': ['#4FA35A', '#1F5A28', '#D6EFD5'],
      'Chispa': ['#E2703A', '#7E3410', '#FBDCC9'], 'Corazón': ['#D66BA0', '#7D2453', '#F8D9E8'],
      'Mente': ['#9AA33A', '#4E5414', '#EEF0CF'], 'Piedra': ['#8C8577', '#45403A', '#E8E4DC'],
    };
    const name = this.props.tipo ?? 'Voz';
    const [base, dark, tint] = types[name] ?? types['Voz'];
    const picked = this.state.picked ?? 0;
    const texts = [
      "Explicar el problema con dos alternativas",
      "Minimizar el problema",
    ];
    const options = texts.map((text, i) => {
      const on = i === picked;
      return { text, on, off: !on, pick: () => this.setState({ picked: i }) };
    });
    return { c: { name, base, dark, tint }, options };
  }
}
</script>
</body>
</html>
