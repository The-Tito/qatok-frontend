<style>

      </label>
      <button type="button" class="sk px" style="height:52px;background:#2A2238;color:#FFFFFF;font-size:14px;font-weight:700">Guardar nombre</button>
    </form>

    <dl style="margin:0;border:3px solid #2A2238;display:flex;flex-direction:column">
      <div style="padding:12px 14px;border-bottom:3px solid #E4DCCB;display:flex;flex-direction:column;gap:4px">
        <dt class="sk" style="font-size:10px;color:#5E5470">Correo</dt>
        <dd style="margin:0;font-size:14px">ana.lopez@ejemplo.com</dd>

      <div style="padding:12px 14px;display:flex;flex-direction:column;gap:4px">

      <a href="MiCuentaEliminar.dc.html" class="sk" style="height:48px;display:flex;align-items:center;justify-content:center;border:3px solid #2A2238;background:#FFFFFF;color:#8A1F16;text-decoration:none;font-size:12px;font-weight:700">Eliminar cuenta</a>

    <a href="CatalogoV2.dc.html" class="sk" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;text-decoration:none;color:#2A2238">
      <svg class="sp" width="20" height="20" viewBox="0 0 11 11" aria-hidden="true"><path fill="#2A2238" d="M5 0h1v3h-1z M4 3h3v1h-3z M3 4h5v1h-5z M0 5h11v1h-11z M3 6h5v1h-5z M4 7h3v1h-3z M5 8h1v3h-1z"/></svg>Jugar</a>
    <a href="PerfilV2.dc.html" aria-current="page" class="sk" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:700;text-decoration:none;background:#2A2238;color:#FFFFFF">

      <svg class="sp" width="20" height="20" viewBox="0 0 12 12" aria-hidden="true"><path fill="#2A2238" d="M1 0h10v1h-10z M2 1h8v4h-8z M3 5h6v1h-6z M4 6h4v1h-4z M5 7h2v2h-2z M3 9h6v1h-6z M2 10h8v2h-8z"/></svg>Evidencias</a>
