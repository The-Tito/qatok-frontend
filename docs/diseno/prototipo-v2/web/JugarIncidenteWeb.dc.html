<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Paso de incidente (web)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Chakra+Petch:wght@600;700&amp;family=Silkscreen:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#2A2238}a:hover{color:#5E5470}
.pf{font-family:'Chakra Petch',sans-serif}
.sk{font-family:'Silkscreen',monospace;text-transform:uppercase;letter-spacing:.04em}
.px{border:3px solid #2A2238;box-shadow:4px 4px 0 #2A2238}
.seg{background-image:repeating-linear-gradient(90deg,transparent 0 14px,#2A2238 14px 16px)}
svg.sp{shape-rendering:crispEdges;display:block}
button{font:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
input,select,textarea{font:inherit;color:#2A2238}
input:focus,select:focus,textarea:focus{outline:3px solid #E8A33D;outline-offset:2px}
::placeholder{color:#8C8577}
</style>
</helmet>
<div style="min-height:900px;background:#FFFFFF;color:#2A2238;font-family:'IBM Plex Mono',monospace;display:flex;flex-direction:column">
  <header style="background:{{c.tint}};border-bottom:3px solid #2A2238;padding:0 32px">
    <div style="max-width:1120px;margin:0 auto;width:100%;box-sizing:border-box;min-height:80px;display:flex;align-items:center;gap:16px">
      <a href="JugarPausaWeb.dc.html" class="sk" style="min-height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;border:3px solid #2A2238;background:#FFFFFF;text-decoration:none;font-size:12px;font-weight:700;flex-shrink:0">II Pausar</a>
      <div style="display:flex;flex-direction:column;gap:4px;flex-grow:1;min-width:0">
        <span class="sk" style="font-size:11px;color:{{c.dark}}">Paso [N] · Incidente</span>
        <span style="font-size:16px;font-weight:600">[TÍTULO DE LA SIMULACIÓN]</span>
      </div>
      <svg class="sp" width="33" height="30" viewBox="0 0 11 10" aria-hidden="true"><path fill="#E2703A" d="M5 0h1v1h-1z M4 1h3v2h-3z M3 3h5v2h-5z M2 5h7v2h-7z M1 7h9v1h-9z M0 8h11v2h-11z"/><path fill="#2A2238" d="M5 3h1v3h-1z M5 7h1v1h-1z"/></svg>
    </div>
  </header>
  <main style="padding:36px 32px 56px;flex-grow:1">
    <div style="max-width:1120px;margin:0 auto;width:100%;box-sizing:border-box;display:flex;gap:40px;flex-wrap:wrap;align-items:flex-start">
      <section aria-label="Situación" style="flex:1 1 520px;min-width:0;display:flex;flex-direction:column;gap:20px">
        <div style="display:flex;flex-direction:column;gap:6px">
      <h1 class="pf" style="margin:0;font-size:34px;font-weight:700">[Título del paso]</h1>
      <p style="margin:0;font-size:15px;line-height:1.6;color:#5E5470">[Descripción del paso]</p>
    </div>
        <article class="px" style="background:#FFFFFF;display:flex;flex-direction:column">
      <div style="padding:10px 12px;border-bottom:3px solid #2A2238;display:flex;justify-content:space-between;align-items:center;gap:8px;background:{{sev.bg}}">
        <span class="sk" style="font-size:10px;color:{{sev.fg}}">Severidad</span>
        <span class="sk" style="font-size:11px;font-weight:700;padding:5px 8px;border:2px solid #2A2238;background:#FFFFFF;color:{{sev.fg}}">{{sev.mark}} {{sev.label}}</span>
      </div>
      <div style="padding:12px;display:flex;flex-direction:column;gap:8px">
        <span class="sk" style="font-size:10px">Cronología</span>
        <ol style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column">
          <li style="display:flex;gap:12px;padding:8px 0;border-bottom:3px dashed #E4DCCB"><span class="sk" style="font-size:11px;width:56px;flex-shrink:0;padding-top:2px">[time]</span><span style="font-size:14px;line-height:1.45">[event]</span></li>
          <li style="display:flex;gap:12px;padding:8px 0;border-bottom:3px dashed #E4DCCB"><span class="sk" style="font-size:11px;width:56px;flex-shrink:0;padding-top:2px">[time]</span><span style="font-size:14px;line-height:1.45">[event]</span></li>
          <li style="display:flex;gap:12px;padding:8px 0"><span class="sk" style="font-size:11px;width:56px;flex-shrink:0;padding-top:2px">[time]</span><span style="font-size:14px;line-height:1.45">[event]</span></li>
        </ol>
      </div>
    </article>
      </section>
      <section aria-label="Decisión" style="flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;align-items:center;gap:8px">
      <span class="sk" style="font-size:13px;font-weight:700">¿Qué haces?</span>
      <span style="flex-grow:1;height:3px;background:#2A2238"></span>
    </div>

    <div role="radiogroup" aria-label="Opciones" style="display:flex;flex-direction:column;gap:10px">
      <sc-for list="{{options}}" as="o" hint-placeholder-count="2">
        <sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}">
          <button type="button" role="radio" aria-checked="true" onClick="{{o.pick}}" style="display:flex;gap:12px;align-items:flex-start;min-height:48px;padding:12px 14px;border:3px solid #2A2238;color:#2A2238;background:{{c.tint}};box-shadow:4px 4px 0 #2A2238">
            <span class="sk" style="font-size:14px;width:14px;flex-shrink:0">▶</span>
            <span style="font-size:14px;line-height:1.45;text-align:left;font-weight:600">{{o.text}}</span>
          </button>
        </sc-if>
        <sc-if value="{{o.off}}" hint-placeholder-val="{{ true }}">
          <button type="button" role="radio" aria-checked="false" onClick="{{o.pick}}" style="display:flex;gap:12px;align-items:flex-start;min-height:48px;padding:12px 14px;border:3px solid #2A2238;color:#2A2238;background:#FFFFFF">
            <span class="sk" style="font-size:14px;width:14px;flex-shrink:0;color:#E4DCCB">▶</span>
            <span style="font-size:14px;line-height:1.45;text-align:left">{{o.text}}</span>
          </button>
        </sc-if>
      </sc-for>
    </div>
        <a href="DecisionWeb.dc.html" class="sk px" style="margin-top:8px;display:flex;justify-content:center;align-items:center;gap:10px;height:56px;background:{{c.dark}};color:#FFFFFF;text-decoration:none;font-size:16px;font-weight:700">Decidir ▶</a>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tipo": {"editor": "enum", "options": ["Voz", "Fuego", "Reloj", "Hoja", "Chispa", "Corazón", "Mente", "Piedra"], "default": "Piedra"}, "severidad": {"editor": "enum", "options": ["LOW", "MEDIUM", "HIGH"], "default": "HIGH"}, "$preview": {"width": 1280, "height": 900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 0 }; }
  renderVals() {
    const types = {
      'Voz': ['#E8A33D', '#7A4A0B', '#FCEBC8'], 'Fuego': ['#D9483B', '#8A1F16', '#F9D7D2'],
      'Reloj': ['#8A5CC7', '#4B2A7A', '#E9DDF7'], 'Hoja': ['#4FA35A', '#1F5A28', '#D6EFD5'],
      'Chispa': ['#E2703A', '#7E3410', '#FBDCC9'], 'Corazón': ['#D66BA0', '#7D2453', '#F8D9E8'],
      'Mente': ['#9AA33A', '#4E5414', '#EEF0CF'], 'Piedra': ['#8C8577', '#45403A', '#E8E4DC'],
    };
    const name = this.props.tipo ?? 'Piedra';
    const [base, dark, tint] = types[name] ?? types['Piedra'];
    const picked = this.state.picked ?? 0;
    const texts = [
      "[Opción A]",
      "[Opción B]",
    ];
    const options = texts.map((text, i) => {
      const on = i === picked;
      return { text, on, off: !on, pick: () => this.setState({ picked: i }) };
    });
    const sevs = {
      'LOW': { label: 'Baja', mark: '▽', bg: '#F5F3EF', fg: '#2A2238' },
      'MEDIUM': { label: 'Media', mark: '◆', bg: '#FCEBC8', fg: '#7A4A0B' },
      'HIGH': { label: 'Alta', mark: '▲', bg: '#F9D7D2', fg: '#8A1F16' },
    };
    const sev = sevs[this.props.severidad ?? 'HIGH'] ?? sevs['HIGH'];
    return { c: { name, base, dark, tint }, options, sev };
  }
}
</script>
</body>
</html>
