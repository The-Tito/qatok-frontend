<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Crear enlace</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Chakra+Petch:wght@600;700&amp;family=Silkscreen:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#2A2238}a:hover{color:#5E5470}
.pf{font-family:'Chakra Petch',sans-serif}
.sk{font-family:'Silkscreen',monospace;text-transform:uppercase;letter-spacing:.04em}
.px{border:3px solid #2A2238;box-shadow:4px 4px 0 #2A2238}
svg.sp{shape-rendering:crispEdges;display:block}
button{font:inherit;cursor:pointer}
input:focus{outline:3px solid #E8A33D;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#2A2238;color:#2A2238;font-family:'IBM Plex Mono',monospace;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;position:relative">
  <a href="EvidenciaDetalle.dc.html" aria-label="Cerrar" style="position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 6px,transparent 6px 12px)"></a>

  <section role="dialog" aria-labelledby="titulo-enlace" style="position:relative;background:#FFFFFF;border-top:3px solid #2A2238;padding:18px 20px 28px;display:flex;flex-direction:column;gap:16px">
    <div style="align-self:center;width:48px;height:6px;background:#E4DCCB"></div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 id="titulo-enlace" class="pf" style="margin:0;font-size:24px;font-weight:700">Crear enlace</h2>
      <a href="EvidenciaDetalle.dc.html" aria-label="Cerrar" class="sk" style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:3px solid #2A2238;text-decoration:none;font-size:13px;font-weight:700">✕</a>
    </div>
    <p style="margin:0;font-size:13px;line-height:1.55;color:#5E5470">Quien tenga el enlace podrá ver esta evidencia sin iniciar sesión. Puedes revocarlo cuando quieras.</p>

    <sc-if value="{{editing}}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;gap:16px">
        <fieldset style="border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px">
          <legend style="font-size:13px;font-weight:600;padding:0;margin-bottom:8px">Vigencia</legend>
          <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
            <sc-for list="{{days}}" as="d" hint-placeholder-count="3">
              <sc-if value="{{d.on}}" hint-placeholder-val="{{ false }}">
                <button type="button" aria-pressed="true" onClick="{{d.pick}}" class="sk" style="height:46px;border:3px solid #2A2238;background:#FCEBC8;color:#2A2238;font-size:12px;font-weight:700;box-shadow:3px 3px 0 #2A2238">{{d.label}}</button>
              </sc-if>
              <sc-if value="{{d.off}}" hint-placeholder-val="{{ true }}">
                <button type="button" aria-pressed="false" onClick="{{d.pick}}" class="sk" style="height:46px;border:3px solid #2A2238;background:#FFFFFF;color:#2A2238;font-size:12px">{{d.label}}</button>
              </sc-if>
            </sc-for>
          </div>
          <span style="font-size:12px;color:#5E5470">Entre 1 y 90 días. Vence el {{expires}}.</span>
        </fieldset>
        <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Para quién (opcional)
          <input type="email" placeholder="correo@empresa.com" style="height:46px;box-sizing:border-box;border:3px solid #2A2238;background:#F5F3EF;padding:0 12px;font:inherit;font-weight:400;font-size:14px;color:#2A2238">
          <span style="font-size:12px;font-weight:400;color:#5E5470">Solo es una nota para ti; no se envía ningún correo.</span>
        </label>
        <button type="button" onClick="{{create}}" class="sk px" style="height:56px;background:#7A4A0B;color:#FFFFFF;font-size:15px;font-weight:700">Crear enlace ▶</button>
      </div>
    </sc-if>

    <sc-if value="{{created}}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;gap:14px">
        <div style="border:3px solid #2A2238;background:#D6EFD5;padding:12px 14px;display:flex;flex-direction:column;gap:8px">
          <span class="sk" style="font-size:11px;color:#1F5A28">★ Enlace listo · vence el {{expires}}</span>
          <span style="font-size:13px;word-break:break-all;background:#FFFFFF;border:2px solid #2A2238;padding:8px 10px">[DOMINIO]/publico/evidencias/&lt;token&gt;</span>
        </div>
        <button type="button" class="sk px" style="height:56px;background:#2A2238;color:#FFFFFF;font-size:15px;font-weight:700">Copiar enlace</button>
        <a href="EvidenciaDetalle.dc.html" class="sk" style="height:48px;display:flex;align-items:center;justify-content:center;border:3px solid #2A2238;text-decoration:none;font-size:12px;font-weight:700">Listo</a>
      </div>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { days: 30, created: false }; }
  renderVals() {
    const picked = this.state.days ?? 30;
    const expiresByDays = { 7: '1 dic 2026', 30: '24 dic 2026', 90: '22 feb 2027' };
    const days = [7, 30, 90].map((n) => ({
      label: n + ' días', on: n === picked, off: n !== picked, pick: () => this.setState({ days: n }),
    }));
    const created = !!this.state.created;
    return {
      days, created, editing: !created, expires: expiresByDays[picked],
      create: () => this.setState({ created: true }),
    };
  }
}
</script>
</body>
</html>
